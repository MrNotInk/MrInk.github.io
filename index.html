<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chutiya Banaya Tumko 😂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
    background-size: 400% 400%;
    animation: bgShift 10s ease infinite;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .emoji-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .emoji {
    position: absolute;
    font-size: 2.5rem;
    animation: floatUp linear infinite;
    opacity: 0.85;
  }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(720deg); }
  }

  .center-wrap {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: clamp(2rem, 7vw, 5.5rem);
    color: #fff;
    text-shadow:
      3px 3px 0 #ff007f,
      6px 6px 0 #000,
      0 0 25px rgba(255, 0, 127, 0.8);
    padding: 25px 45px;
    border: 6px dashed #fff;
    border-radius: 25px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
    animation: wiggle 1.5s ease-in-out infinite, pop 0.8s ease-out;
    transform-origin: center;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-2deg) scale(1); }
    50%      { transform: rotate(2deg) scale(1.03); }
  }

  @keyframes pop {
    0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
</style>
</head>
<body>

  <div class="emoji-bg" id="emojiBg"></div>

  <div class="center-wrap">
    <h1>😂 Chutiya Banaya Tum Ko 🤡</h1>
  </div>

<script>
  const emojis = ["😂","🤣","🤡","🙃","😜","🤪","😹","🥳","🎉","💀","👻","🙈","🤭","😎","🫠","🤌","🍌","🐒","👀","🎭"];
  const bg = document.getElementById("emojiBg");
  const count = 50;

  for (let i = 0; i < count; i++) {
    const span = document.createElement("span");
    span.className = "emoji";
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    span.style.left = Math.random() * 100 + "vw";
    span.style.fontSize = (Math.random() * 2.5 + 1.5) + "rem";
    span.style.animationDuration = (Math.random() * 10 + 6) + "s";
    span.style.animationDelay = (Math.random() * 10) + "s";
    bg.appendChild(span);
  }
</script>

</body>
</html>
